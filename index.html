<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shifrovka · Prototype 3</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 16px; background:#14161a; color:#e8e8e8; }
  h1 { font-size: 20px; }
  textarea { width: 100%; min-height: 110px; background:#1e2126; color:#e8e8e8; border:1px solid #3a3f46; border-radius:8px; padding:10px; font: 15px monospace; box-sizing: border-box; }
  button, select, input { font: 15px system-ui; background:#2a2f36; color:#e8e8e8; border:1px solid #3a3f46; border-radius:8px; padding:8px 14px; margin:4px 4px 4px 0; }
  button { cursor:pointer; background:#3f5178; border-color:#3f5178; }
  button:hover { background:#5a6f9e; }
  label { margin-right: 10px; }
  #status { color:#9aa4af; font-size:13px; margin:6px 0; }
</style>
</head>
<body>
<h1 id="title"></h1>
<div id="status"></div>
<textarea id="in"></textarea>
<div>
  <label><input type="radio" name="key" value="date" checked><span id="lblDate"></span></label>
  <input type="date" id="date">
  <label><input type="radio" name="key" value="pass"><span id="lblPass"></span></label>
  <input type="text" id="pass" size="16">
</div>
<div>
  <button id="enc"></button>
  <button id="dec"></button>
  <button id="copy"></button>
  <select id="lang"><option value="RU">RU</option><option value="EN">EN</option><option value="JP">JP</option></select>
</div>
<textarea id="out" readonly></textarea>

<script>
"use strict";
// ---------- КОЛЬЦА (как в prototype3) ----------
const RU_LETTERS = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
const EN_LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const DIGITS = "0123456789";
const PUNCT = ".,!?;:-()\"'№#%&*@+/=<>_~^$";
const JP_PUNCT = "、。，．！？〈〉「」『』【】〜";
const MARKER = "ヿ";
const range = (a,b) => { let s=""; for (let c=a;c<=b;c++) s+=String.fromCharCode(c); return s; };
const HIRAGANA = range(0x3041,0x3096), KATAKANA = range(0x30A1,0x30FA), KANJI = range(0x4E00,0x9FFF);
const RINGS = [RU_LETTERS, EN_LETTERS, HIRAGANA, KATAKANA, KANJI];
const ringFor = ch => RINGS.find(r => r.includes(ch)) || null;
const isLetter = ch => ringFor(ch.toUpperCase()) !== null;
const scriptOf = w => { for (const ch of w) { const r = ringFor(ch.toUpperCase()); if (r===RU_LETTERS) return 0; if (r===EN_LETTERS) return 1; if (r) return 2; } return -1; };
const mod = (a,b) => ((a%b)+b)%b;

// ---------- СЛОВАРИ ----------
const buckets = new Map(), index = new Map();
function addWord(line, script){
  const w = line.trim().toLowerCase();
  if (!w) return;
  for (const ch of w) if (!isLetter(ch)) return;
  if (scriptOf(w) !== script) return;
  const key = script*10000 + w.length;
  let m = index.get(key); if (!m) { m = new Map(); index.set(key, m); }
  if (m.has(w)) return;
  let list = buckets.get(key); if (!list) { list = []; buckets.set(key, list); }
  m.set(w, list.length); list.push(w);
}
async function loadDict(url, script){
  try { const t = await (await fetch(url)).text(); for (const line of t.split(/\r?\n/)) addWord(line, script); return true; }
  catch(e){ return false; }
}
const idxOf = (script, word) => { const m = index.get(script*10000 + word.length); return (m && m.has(word)) ? m.get(word) : undefined; };

// ---------- КЛЮЧ: SHA-256 от даты или пароля (как в prototype3) ----------
async function sha256Bytes(bytes){
  if (!crypto.subtle) throw new Error("crypto.subtle unavailable (нужен http(s), не file://)");
  return new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
}
function todayISO(){ const d=new Date(), p=x=>String(x).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
async function baseFor(){
  const mode = document.querySelector('input[name=key]:checked').value;
  const pass = document.getElementById("pass").value;
  let keyStr;
  if (mode === "pass" && pass.trim() !== "") keyStr = pass;
  else { const dv = document.getElementById("date").value; keyStr = dv !== "" ? dv : todayISO(); }
  const h = await sha256Bytes(new TextEncoder().encode(keyStr));
  return ((h[0]<<24)|(h[1]<<16)|(h[2]<<8)|h[3]) & 0x7FFFFFFF;
}

// ---------- ШИФР / РАСШИФР (зеркально prototype3) ----------
function encryptWord(token, base, counter){
  const lower = token.toLowerCase();
  const script = scriptOf(lower);
  const idx = script < 0 ? undefined : idxOf(script, lower);
  if (idx !== undefined) {
    const bucket = buckets.get(script*10000 + lower.length), size = bucket.length;
    const shift = mod(base + counter, size);
    return { out: bucket[mod(idx + shift, size)], counter: counter + 1 };
  }
  let out = ""; if (script === 2) out += MARKER;
  for (const c of token) {
    const up = c.toUpperCase(), ring = ringFor(up);
    if (!ring) { out += c; counter++; continue; }
    const shift = mod(base + counter, ring.length), pos = ring.indexOf(up);
    out += ring[mod(pos + shift, ring.length)]; counter++;
  }
  return { out, counter };
}
function decryptWord(token, base, counter){
  const marked = token[0] === MARKER;
  const body = marked ? token.slice(1) : token;
  if (!body.length) return { out: token, counter };
  const script = scriptOf(body);
  if (!marked && script >= 0) {
    const lower = body.toLowerCase();
    const allUpper = body === body.toUpperCase() && body !== lower;
    if (!allUpper) {
      const idx = idxOf(script, lower);
      if (idx !== undefined) {
        const bucket = buckets.get(script*10000 + body.length), size = bucket.length;
        const shift = mod(base + counter, size);
        return { out: bucket[mod(idx - shift, size)], counter: counter + 1 };
      }
      if (script !== 2) return { out: token, counter };
    }
  }
  let out = "";
  for (const c of body) {
    const up = c.toUpperCase(), ring = ringFor(up);
    if (!ring) { out += c; counter++; continue; }
    const shift = mod(base + counter, ring.length), pos = ring.indexOf(up);
    out += ring[mod(pos - shift, ring.length)]; counter++;
  }
  return { out, counter };
}
function run(text, base, enc){
  let out = "", counter = 0, i = 0; const n = text.length;
  while (i < n) {
    const ch = text[i];
    if (ch >= "0" && ch <= "9") {
      let j = i; while (j < n && text[j] >= "0" && text[j] <= "9") j++;
      for (let k = i; k < j; k++) {
        const shift = mod(base + counter, DIGITS.length), pos = DIGITS.indexOf(text[k]);
        out += DIGITS[mod(pos + (enc?shift:-shift), DIGITS.length)]; counter++;
      }
      i = j;
    } else if (isLetter(ch) || (!enc && ch === MARKER)) {
      let j = i; while (j < n && (isLetter(text[j]) || (!enc && text[j] === MARKER))) j++;
      const r = enc ? encryptWord(text.slice(i,j), base, counter) : decryptWord(text.slice(i,j), base, counter);
      out += r.out; counter = r.counter; i = j;
    } else if (PUNCT.includes(ch) || JP_PUNCT.includes(ch)) {
      const ring = PUNCT.includes(ch) ? PUNCT : JP_PUNCT;
      const shift = mod(base + counter, ring.length), pos = ring.indexOf(ch);
      out += ring[mod(pos + (enc?shift:-shift), ring.length)]; counter++; i++;
    } else { out += ch; i++; }
  }
  return out;
}

// ---------- ИНТЕРФЕЙС ----------
const L = {
  RU: { title:"Шифровка · Прототип 3", in:"Сообщение", out:"Результат", enc:"Зашифровать", dec:"Расшифровать",
        copy:"Копировать", date:"Дата ключа", pass:"Пароль ключа", load:"Загрузка словарей…",
        ready:n=>`Словари: RU ${n[0]}, EN ${n[1]}, JP ${n[2]}`, err:"Словари не загрузились: положи txt рядом с index.html и открой через http(s)", copied:"Скопировано" },
  EN: { title:"Shifrovka · Prototype 3", in:"Message", out:"Result", enc:"Encrypt", dec:"Decrypt",
        copy:"Copy", date:"Key date", pass:"Key password", load:"Loading dictionaries…",
        ready:n=>`Dictionaries: RU ${n[0]}, EN ${n[1]}, JP ${n[2]}`, err:"Dictionaries failed to load: put txt files next to index.html and open via http(s)", copied:"Copied" },
  JP: { title:"Shifrovka · プロトタイプ3", in:"メッセージ", out:"結果", enc:"暗号化", dec:"復号",
        copy:"コピー", date:"鍵の日付", pass:"鍵のパスワード", load:"辞書を読み込み中…",
        ready:n=>`辞書: RU ${n[0]}, EN ${n[1]}, JP ${n[2]}`, err:"辞書を読み込めません: txtをindex.htmlの隣に置いてhttp(s)で開いてください", copied:"コピーしました" }
};
let lang = "RU";
function applyLang(){
  const t = L[lang];
  title.textContent = t.title; status.textContent = t.load;
  document.getElementById("in").placeholder = t.in;
  document.getElementById("out").placeholder = t.out;
  enc.textContent = t.enc; dec.textContent = t.dec; copy.textContent = t.copy;
  lblDate.textContent = t.date; lblPass.textContent = t.pass;
}
lang.onchange = () => { lang = lang.value; applyLang(); refreshStatus(); };

let counts = [0,0,0], loaded = false;
function refreshStatus(){
  const t = L[lang];
  status.textContent = loaded ? t.ready(counts) : t.err;
}

enc.onclick = async () => { out.value = run(in.value, await baseFor(), true); };
dec.onclick = async () => { out.value = run(in.value, await baseFor(), false); };
copy.onclick = () => navigator.clipboard.writeText(out.value).then(() => {
  const t = L[lang]; copy.textContent = t.copied; setTimeout(()=>copy.textContent = t.copy, 1200);
});

(async () => {
  document.getElementById("date").value = todayISO();
  applyLang();
  const r = await loadDict("russian-utf8.txt", 0);
  const e = await loadDict("english-utf8.txt", 1);
  const j = await loadDict("japanese-utf8.txt", 2);
  counts = [0,1,2].map(s => [...buckets.keys()].filter(k => Math.floor(k/10000) === s).reduce((a,k)=>a+buckets.get(k).length, 0));
  loaded = r || e;
  refreshStatus();
})();
</script>
</body>
</html>
